}

.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

.ms-host { --ms-ink: light-dark(rgb(26 28 31), rgb(245 245 247)); --ms-sub: light-dark(rgba(26 28 31 / 0.56), rgba(245 245 247 / 0.56)); --ms-sub2: light-dark(rgba(26 28 31 / 0.38), rgba(245 245 247 / 0.38)); --ms-ink-08: light-dark(rgba(26 28 31 / 0.10), rgba(245 245 247 / 0.10)); --ms-ink-12: light-dark(rgba(26 28 31 / 0.14), rgba(245 245 247 / 0.14)); --ms-ink-22: light-dark(rgba(26 28 31 / 0.22), rgba(245 245 247 / 0.22)); --ms-red: light-dark(rgb(200 38 33), rgb(255 103 100)); --ms-green: light-dark(rgb(0 150 60), rgb(72 201 120)); --ms-accent: light-dark(rgb(0 122 255), rgb(90 165 255)); --ms-glass: light-dark(rgba(246 246 248 / 0.78), rgba(22 22 25 / 0.82)); --ms-panel: light-dark(rgba(0 0 0 / 0.035), rgba(255 255 255 / 0.045)); --ms-hair: light-dark(rgba(0 0 0 / 0.12), rgba(255 255 255 / 0.13)); --ms-grid: light-dark(rgba(0 0 0 / 0.045), rgba(255 255 255 / 0.045)); --ms-scan: light-dark(rgba(0 0 0 / 0.028), rgba(255 255 255 / 0.03)); max-width: 460px; margin: 0 auto; font-family: &#x27;NeoDunggeunmo&#x27;, ui-monospace, monospace; color: var(--ms-ink); -webkit-font-smoothing: none; }

.ms-controls { display: flex; gap: 6px; align-items: center; justify-content: center; flex-wrap: wrap; margin: 0 0 14px; font-size: 12px; line-height: 1; }
.ms-ctl { font-family: inherit; font-size: 12px; line-height: 1; color: var(--ms-sub); background: transparent; border: 1px solid var(--ms-hair); border-radius: 7px; padding: 7px 10px; cursor: pointer; appearance: none; }
.ms-ctl:hover { color: var(--ms-ink); border-color: var(--ms-ink-22); }
.ms-ctl[aria-pressed=&quot;true&quot;] { color: #fff; background: var(--ms-ink); border-color: var(--ms-ink); }
.ms-ctl-group { display: inline-flex; border: 1px solid var(--ms-hair); border-radius: 7px; overflow: hidden; }
.ms-ctl-group .ms-ctl { border: 0; border-radius: 0; border-left: 1px solid var(--ms-hair); }
.ms-ctl-group .ms-ctl:first-child { border-left: 0; }
.ms-ctl-sep { width: 1px; align-self: stretch; background: var(--ms-hair); margin: 2px 4px; }
.ms-ctl-hint { font-size: 11px; color: var(--ms-sub2); }

.ms-popover { position: relative; width: 100%; max-width: 400px; height: 600px; margin: 0 auto; background: var(--ms-glass); border: 1px solid var(--ms-hair); border-radius: 20px; overflow: hidden; box-shadow: 0 24px 60px -20px rgba(0 0 0 / 0.5); display: flex; flex-direction: column; }
.ms-popover::before, .ms-popover::after { content: &quot;&quot;; position: absolute; inset: 0; pointer-events: none; z-index: 0; }
.ms-popover::before { background-image: linear-gradient(var(--ms-grid) 1px, transparent 1px), linear-gradient(90deg, var(--ms-grid) 1px, transparent 1px); background-size: 4px 4px; opacity: 0.6; }
.ms-popover::after { background: repeating-linear-gradient(0deg, transparent 0 2px, var(--ms-scan) 2px 3px); opacity: 0.5; }

.ms-inner { position: relative; z-index: 1; display: flex; flex-direction: column; height: 100%; }

.ms-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 14px; flex: 0 0 auto; }
.ms-head .ms-back { display: inline-flex; width: 24px; height: 24px; align-items: center; justify-content: center; color: var(--ms-ink); background: transparent; border: 0; cursor: pointer; padding: 0; }
.ms-head .ms-back svg { width: 16px; height: 16px; }
.ms-head h1 { font-size: 18px; line-height: 1; margin: 0; flex: 1; font-weight: 400; letter-spacing: 0.5px; }
.ms-head .ms-gear { color: var(--ms-ink); background: transparent; border: 0; cursor: pointer; padding: 0; width: 26px; height: 26px; display: inline-flex; align-items: center; justify-content: center; }
.ms-head .ms-gear svg { width: 18px; height: 18px; }

.ms-scroll { flex: 1 1 auto; overflow-y: auto; padding: 4px 22px 12px; scrollbar-width: thin; }
.ms-scroll::-webkit-scrollbar { width: 6px; }
.ms-scroll::-webkit-scrollbar-thumb { background: var(--ms-ink-22); border-radius: 3px; }

.ms-disk { display: flex; align-items: baseline; gap: 8px; }
.ms-disk .big { font-size: 30px; line-height: 1; }
.ms-disk .lbl { font-size: 12px; color: var(--ms-sub); }
.ms-bar { display: flex; gap: 1px; height: 10px; margin-top: 8px; }
.ms-bar &gt; i { flex: 1 1 0; border-radius: 1px; background: var(--ms-ink-08); }
.ms-bar &gt; i.on { background: var(--ms-ink); }
.ms-disk-desc { font-size: 10px; color: var(--ms-sub); margin-top: 5px; line-height: 1.4; }

.ms-div { height: 1px; background: var(--ms-hair); margin: 14px 0; }

.ms-sec-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.ms-sec-head h2 { font-size: 14px; line-height: 1; margin: 0; font-weight: 400; flex: 1; }
.ms-sec-head .ms-spinner { width: 13px; height: 13px; border-radius: 50%; border: 2px solid var(--ms-ink-22); border-top-color: var(--ms-ink); animation: ms-spin 0.7s linear infinite; display: inline-block; flex: 0 0 auto; }
.ms-sec-head .ms-sec-icon { width: 15px; height: 15px; display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.ms-sec-head .ms-sec-icon svg { width: 15px; height: 15px; }
.ms-sec-head .ms-sec-icon.is-ok { color: var(--ms-green); }
.ms-sec-head .ms-sec-icon.is-err { color: var(--ms-red); }
.ms-sec-sub { font-size: 10px; color: var(--ms-sub); margin: 2px 0 10px; line-height: 1.4; }

.ms-tally { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 6px; }
.ms-tally .num { font-size: 14px; }
.ms-tally .freed { font-size: 12px; color: var(--ms-sub); margin-left: auto; }
.ms-tally .freed b { color: var(--ms-ink); font-weight: 400; }

.ms-prog { margin: 4px 0 8px; }
.ms-cur { font-size: 11px; color: var(--ms-sub); margin: 8px 0 6px; line-height: 1.4; }
.ms-cur b { color: var(--ms-ink); font-weight: 400; }

.ms-list { display: flex; flex-direction: column; gap: 1px; margin-top: 6px; }
.ms-row { display: flex; align-items: center; gap: 9px; padding: 6px 4px; border-radius: 5px; }
.ms-row.active { background: var(--ms-panel); box-shadow: inset 2px 0 0 var(--ms-ink); }
.ms-row .ms-chk { width: 13px; height: 13px; border: 1.5px solid var(--ms-ink-22); border-radius: 2px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
.ms-row.sel .ms-chk { border-color: var(--ms-ink); background: var(--ms-ink); }
.ms-row.sel .ms-chk::after { content: &quot;&quot;; width: 5px; height: 8px; border: solid var(--ms-glass); border-width: 0 1.5px 1.5px 0; transform: rotate(45deg) translate(-1px, -1px); }
.ms-row .ms-st { width: 15px; height: 15px; flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center; }
.ms-row .ms-st svg { width: 13px; height: 13px; }
.ms-row .ms-st .ms-spinner { width: 11px; height: 11px; border-width: 2px; }
.ms-row .ms-name { font-size: 11px; line-height: 1.25; flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ms-row .ms-size { font-size: 10px; color: var(--ms-sub); flex: 0 0 auto; font-variant-numeric: tabular-nums; }
.ms-row .ms-tag { font-size: 10px; color: var(--ms-sub2); flex: 0 0 auto; }
.ms-row .ms-name.muted { color: var(--ms-sub2); }
.ms-row .ms-st.is-ok { color: var(--ms-green); }
.ms-row .ms-st.is-err { color: var(--ms-red); }
.ms-row .ms-st.is-wait { color: var(--ms-sub2); }
.ms-row .ms-st.is-run { color: var(--ms-ink); }

.ms-ded { background: var(--ms-panel); border: 1px solid var(--ms-hair); border-radius: 12px; padding: 16px; }
.ms-ded .ms-ded-pct { font-size: 30px; line-height: 1; }
.ms-ded .ms-ded-freed { font-size: 12px; color: var(--ms-sub); margin-top: 4px; }
.ms-ded .ms-ded-freed b { color: var(--ms-ink); font-weight: 400; }

&lt;script&gt;
(function () {
  const ITEMS = [
    { name: &quot;SwiftUI-Sampler-aa11bb22&quot;, size: 312 * 1048576, out: &quot;deleted&quot; },

    { name: &quot;MyCoreDataApp-q1w2e3r4&quot;, size: 842 * 1048576, out: &quot;deleted&quot; },
    { name: &quot;TestSchemeZZ-99mmnn88&quot;, size: 214 * 1048576, out: &quot;deleted&quot; },
    { name: &quot;SharedCache-ios-12ab34&quot;, size: 120 * 1048576, out: &quot;kept&quot; }

  const TOTAL = ITEMS.length;
  const FAILED_AT = 2;

  const state = { phase: &quot;running&quot;, layout: &quot;inline&quot;, step: 3, cancelled: false };

  const $ = (id) =&gt; document.getElementById(id);
  const scrollEl = $(&quot;ms-scroll&quot;);

  function bytes(n) {

    const u = [&quot;B&quot;, &quot;KB&quot;, &quot;MB&quot;, &quot;GB&quot;, &quot;TB&quot;];
    let v = n, i = 0;
    while (v &gt;= 1024 &amp;&amp; i &lt; u.length - 1) { v /= 1024; i++; }

    return v.toFixed(d) + &quot; &quot; + u[i];
  }

    if (state.phase === &quot;failed&quot;) {

      if (idx === FAILED_AT) return &quot;failed&quot;;
      return &quot;pending&quot;;
    }
    if (idx &lt; r) return ITEMS[idx].out;
    if (state.phase === &quot;running&quot; &amp;&amp; idx === r) return &quot;running&quot;;
    return &quot;pending&quot;;
  }

  function freedBytes() {
    let s = 0;
    for (let i = 0; i &lt; resolvedCount(); i++) if (itemOutcome(i) === &quot;deleted&quot;) s += ITEMS[i].size;
    return s;
  }
  function deletedCount() {
    let c = 0;
    for (let i = 0; i &lt; resolvedCount(); i++) if (itemOutcome(i) === &quot;deleted&quot;) c++;
    return c;
  }
  function keptCount() {
    let c = 0;
    for (let i = 0; i &lt; resolvedCount(); i++) if (itemOutcome(i) === &quot;kept&quot;) c++;
    return c;
  }

  function statusIcon(outcome) {
    switch (outcome) {
      case &quot;deleted&quot;: return &#x27;&lt;span class=&quot;ms-st is-ok&quot;&gt;&lt;i data-lucide=&quot;check&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;;
      case &quot;kept&quot;: return &#x27;&lt;span class=&quot;ms-st is-wait&quot;&gt;&lt;i data-lucide=&quot;minus&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;;
      case &quot;running&quot;: return &#x27;&lt;span class=&quot;ms-st is-run&quot;&gt;&lt;span class=&quot;ms-spinner&quot; aria-hidden=&quot;true&quot;&gt;&lt;/span&gt;&lt;/span&gt;&#x27;;
      case &quot;failed&quot;: return &#x27;&lt;span class=&quot;ms-st is-err&quot;&gt;&lt;i data-lucide=&quot;x&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;;
      case &quot;pending&quot;: return &#x27;&lt;span class=&quot;ms-st is-wait&quot;&gt;&lt;i data-lucide=&quot;circle&quot; aria-hidden=&quot;true&quot;&gt;&lt;/i&gt;&lt;/span&gt;&#x27;;
      default: return &quot;&quot;;
    }
  }
  function statusTag(outcome) {
    switch (outcome) {
      case &quot;deleted&quot;: return &quot;삭제됨&quot;;
      case &quot;kept&quot;: return &quot;유지&quot;;
      case &quot;running&quot;: return &quot;삭제 중&quot;;
      case &quot;failed&quot;: return &quot;실패&quot;;
      case &quot;pending&quot;: return &quot;대기&quot;;
      default: return &quot;&quot;;

  function segBar(filled, total) {

    for (let i = 0; i &lt; cells; i++) h += &#x27;&lt;i class=&quot;&#x27; + (i &lt; onCount ? &quot;on&quot; : &quot;&quot;) + &#x27;&quot;&gt;&lt;/i&gt;&#x27;;
    h += &quot;&lt;/div&gt;&quot;;
    return h;
  }

  function diskBlock() {
    const pct = 48.0;
    const cells = 24, onCount = Math.round(pct / 100 * cells);
    let bar = &#x27;&lt;div class=&quot;ms-bar&quot; role=&quot;progressbar&quot; aria-label=&quot;디스크 사용률&quot; aria-valuenow=&quot;48&quot; aria-valuemin=&quot;0&quot; aria-valuemax=&quot;100&quot;&gt;&#x27;;
    for (let i = 0; i &lt; cells; i++) bar += &#x27;&lt;i class=&quot;&#x27; + (i &lt; onCount ? &quot;on&quot; : &quot;&quot;) + &#x27;&quot;&gt;&lt;/i&gt;&#x27;;
    bar += &quot;&lt;/div&gt;&quot;;
    return &#x27;&lt;div class=&quot;ms-disk&quot;&gt;&lt;span class=&quot;big&quot;&gt;520 GB&lt;/span&gt;&lt;span class=&quot;lbl&quot;&gt;여유 공간&lt;/span&gt;&lt;/div&gt;&#x27; + bar +
      &#x27;&lt;div class=&quot;ms-disk-desc&quot;&gt;스토리지 48.0% 사용 · 여유 520 GB / 1.00 TB&lt;br&gt;Finder 기준 사용 가능 540 GB · 정리 가능 20 GB&lt;/div&gt;&#x27;;

  function curItem() {

  function inlineBody() {
    if (state.phase === &quot;confirm&quot;) {

        &#x27;&lt;div class=&quot;ttl&quot;&gt;선택한 &#x27; + TOTAL + &quot;개 · &quot; + bytes(totalBytes) + &quot;를 영구 삭제할까요?&lt;/div&gt;&quot; +

    if (state.phase === &quot;running&quot; || state.phase === &quot;failed&quot;) {
      h += &#x27;&lt;div class=&quot;ms-tally&quot;&gt;&lt;span class=&quot;num&quot;&gt;&#x27; + r + &quot; / &quot; + TOTAL + &#x27; 항목&lt;/span&gt;&#x27; +

      const cur = curItem();
      if (cur) h += &#x27;&lt;div class=&quot;ms-cur&quot;&gt;삭제 중: &lt;b&gt;&#x27; + cur.name + &quot;&lt;/b&gt; · &quot; + bytes(cur.size) + &quot;&lt;/div&gt;&quot;;
      else if (state.phase === &quot;failed&quot;) h += &#x27;&lt;div class=&quot;ms-cur&quot;&gt;&#x27; + ITEMS[FAILED_AT].name + &quot;에서 중단&lt;/div&gt;&quot;;
    } else if (state.phase === &quot;done&quot;) {

      h += &#x27;&lt;div class=&quot;ms-result-rows&quot;&gt;&#x27; +
        &#x27;&lt;span class=&quot;k&quot;&gt;삭제 &lt;span class=&quot;v ok&quot;&gt;&#x27; + deletedCount() + &quot;&lt;/span&gt;&lt;/span&gt;&quot; +
        &#x27;&lt;span class=&quot;k&quot;&gt;유지 &lt;span class=&quot;v&quot;&gt;&#x27; + keptCount() + &quot;&lt;/span&gt;&lt;/span&gt;&quot; +
        &#x27;&lt;span class=&quot;k&quot;&gt;전체 &lt;span class=&quot;v&quot;&gt;&#x27; + TOTAL + &quot;&lt;/span&gt;&lt;/span&gt;&quot; +
        &quot;&lt;/div&gt;&quot;;
    }
    h += &#x27;&lt;div class=&quot;ms-list&quot;&gt;&#x27;;
    for (let i = 0; i &lt; TOTAL; i++) {
      const it = ITEMS[i];
      const oc = itemOutcome(i);
      const sel = state.phase === &quot;confirm&quot; ? &quot; sel&quot; : &quot;&quot;;
      const active = oc === &quot;running&quot; ? &quot; active&quot; : &quot;&quot;;
      const muted = (oc === &quot;pending&quot; || oc === &quot;kept&quot;) ? &quot; muted&quot; : &quot;&quot;;
      h += &#x27;&lt;div class=&quot;ms-row&#x27; + sel + active + &#x27;&quot;&gt;&#x27;;

      h += &#x27;&lt;span class=&quot;ms-name&#x27; + muted + &#x27;&quot;&gt;&#x27; + it.name + &quot;&lt;/span&gt;&quot;;
      h += &#x27;&lt;span class=&quot;ms-size&quot;&gt;&#x27; + bytes(it.size) + &quot;&lt;/span&gt;&quot;;
      if (state.phase !== &quot;confirm&quot;) h += &#x27;&lt;span class=&quot;ms-tag&quot;&gt;&#x27; + statusTag(oc) + &quot;&lt;/span&gt;&quot;;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;
  let lastPointerWasTouch = false;
  let pinnedByTouch = false;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    pinnedByTouch = false;
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );

        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;

        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handlePointer = (event) =&gt; {
    lastPointerWasTouch =
      event.type === &quot;pointerdown&quot; &amp;&amp; event.pointerType === &quot;touch&quot;;
  };
  const handleTouchClick = (event) =&gt; {
    const isTouch = event.pointerType === &quot;touch&quot; || lastPointerWasTouch;
    lastPointerWasTouch = false;
    if (!isTouch || event.detail === 0) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (
      trigger == null ||
      !trigger.isConnected ||
      getContent(trigger).length === 0 ||
      (pinnedByTouch &amp;&amp; activeTrigger === trigger)
    ) {
      if (pinnedByTouch) {
        closeTooltip();
      }
      return;
    }
    openTooltip(trigger);
    pinnedByTouch = activeTrigger === trigger;
    window.setTimeout(() =&gt; {
      if (activeTrigger === trigger &amp;&amp; !trigger.isConnected) {
        closeTooltip(false);
      }

    if (pinnedByTouch) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };

    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    lastPointerWasTouch = false;
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    lastPointerWasTouch = false;
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerdown&quot;, handlePointer);
    document.removeEventListener(&quot;pointercancel&quot;, handlePointer);
    document.removeEventListener(&quot;click&quot;, handleTouchClick);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerdown&quot;, handlePointer);
  document.addEventListener(&quot;pointercancel&quot;, handlePointer);
  document.addEventListener(&quot;click&quot;, handleTouchClick);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();

&lt;script id=&quot;codex-visualization-tabs&quot;&gt;
(() =&gt; {

      const id = tab.getAttribute(&quot;aria-controls&quot;);

      return;

      selectTab(tab);
      return;

      tab.closest(&#x27;[role=&quot;tablist&quot;]&#x27;).querySelectorAll(&#x27;[role=&quot;tab&quot;]&#x27;),
    ).filter((candidate) =&gt; !candidate.matches(disabled));
    const current = tabs.indexOf(tab);
    let next;
    if (event.key === &quot;ArrowRight&quot; || event.key === &quot;ArrowDown&quot;) {
      next = (current + 1) % tabs.length;
    } else if (event.key === &quot;ArrowLeft&quot; || event.key === &quot;ArrowUp&quot;) {
      next = (current + tabs.length - 1) % tabs.length;
    } else if (event.key === &quot;Home&quot;) {
      next = 0;
    } else if (event.key === &quot;End&quot;) {
      next = tabs.length - 1;
    } else {
      return;
    }
    event.preventDefault();
    tabs[next].focus();
    selectTab(tabs[next]);
  };

  for (const list of document.querySelectorAll(&#x27;.nav[role=&quot;tablist&quot;]&#x27;)) {
    const selected =
      list.querySelector(&#x27;[role=&quot;tab&quot;][aria-selected=&quot;true&quot;]&#x27;) ??
      list.querySelector(&#x27;[role=&quot;tab&quot;].active&#x27;) ??

  }, { once: true });
